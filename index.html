<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Juha Cyworld</title>

<style>
/* =========================
   🌿 BASE
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    padding:20px;
}

/* =========================
   📦 MAIN FRAME (싸이월드 스킨)
========================= */
.frame{
    width:1000px;
    height:700px;
    background:white;
    border:2px solid #999;
    display:flex;
    flex-direction:column;
}

/* =========================
   🔝 TOP BAR
========================= */
.topbar{
    height:40px;
    background:#e9e9e9;
    border-bottom:1px solid #ccc;
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:13px;
}

/* =========================
   MAIN AREA
========================= */
.main{
    flex:1;
    display:flex;
}

/* =========================
   LEFT PROFILE
========================= */
.left{
    width:22%;
    border-right:1px solid #ccc;
    padding:10px;
}

.avatar{
    width:100px;
    height:100px;
    background:linear-gradient(135deg,#ffeaa7,#b8e994);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin:auto;
    margin-bottom:10px;
    border:1px solid #aaa;
}

.box{
    border:1px solid #ddd;
    padding:6px;
    font-size:12px;
    margin-bottom:6px;
}

/* =========================
   CENTER CONTENT
========================= */
.center{
    width:58%;
    border-right:1px solid #ccc;
    padding:10px;
}

.tabs{
    font-size:12px;
    margin-bottom:10px;
}

.room{
    height:220px;
    border:1px solid #ccc;
    background:linear-gradient(135deg,#fff6c9,#cfe8c9);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
}

/* =========================
   POSTS
========================= */
.post{
    border:1px solid #ddd;
    margin-top:10px;
    padding:8px;
    font-size:12px;
}

/* =========================
   RIGHT MENU
========================= */
.right{
    width:20%;
    padding:10px;
}

.menu button{
    width:100%;
    margin-bottom:6px;
    padding:6px;
    font-size:12px;
    border:1px solid #ccc;
    background:#f5f5f5;
    cursor:pointer;
}

.menu button:hover{
    background:#ffeaa7;
}

/* =========================
   GUESTBOOK
========================= */
input, textarea{
    width:100%;
    margin-top:5px;
    font-size:12px;
    padding:5px;
    border:1px solid #ccc;
}

</style>
</head>

<body>

<div class="frame">

    <!-- TOP -->
    <div class="topbar">
        💙 사이좋은 사람들 | Juha Cyworld Minihome
    </div>

    <div class="main">

        <!-- LEFT -->
        <div class="left">

            <div class="avatar">👧🏻</div>

            <div class="box">이름: 전주하</div>
            <div class="box">상태: 꿀꿀해ㅠㅡㅜ</div>
            <div class="box">음악: 윤하 - 우산</div>
            <div class="box">하고 싶은 말:<br>오늘도... 난... 눈물을 흘린ㄷr...</div>

        </div>

        <!-- CENTER -->
        <div class="center">

            <div class="tabs">Home | Miniroom | Diary | Guestbook</div>

            <div class="room">🐰</div>

            <div class="post">📌 Today: 몽글몽글한 하루</div>
            <div class="post">🌿 Feeling: 조용히 우울하지만 따뜻함</div>

            <div class="post">
                💌 방명록 미리보기
                <div id="list"></div>
            </div>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="menu">
                <button>홈</button>
                <button>프로필</button>
                <button>사진첩</button>
                <button>방명록</button>
            </div>

            <input id="name" placeholder="이름">
            <textarea id="msg" placeholder="메시지"></textarea>
            <button onclick="add()">작성</button>

        </div>

    </div>
</div>

<script>

let guest = JSON.parse(localStorage.getItem("guest")||"[]");

function add(){

    const name=document.getElementById("name").value;
    const msg=document.getElementById("msg").value;

    if(!name||!msg) return;

    guest.push({name,msg});

    localStorage.setItem("guest",JSON.stringify(guest));

    render();

}

function render(){

    const list=document.getElementById("list");
    list.innerHTML="";

    guest.slice(-3).reverse().forEach(g=>{
        const div=document.createElement("div");
        div.innerHTML=`<b>${g.name}</b>: ${g.msg}`;
        list.appendChild(div);
    });

}

render();

</script>

</body>
</html>
